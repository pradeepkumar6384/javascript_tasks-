<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Cards</title>

    <style>
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 220px;
            padding: 15px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>Products</h1>

    <div id="products" class="products"></div>

    <script src="./script1.js"></script>

</body>
</html>
