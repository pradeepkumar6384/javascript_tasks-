<!DOCTYPE html>
<html>
<head>
    <title>College Admission</title>
</head>
<body>

    <script>
        // College Name
        const collegeName = "APPA Engineering College";

        // Get input from user
        let studentName = prompt("Enter Student Name:");
        let course = prompt("Enter Course:");

        // Display output
        document.write("<h2>College Admission Details</h2>");
        document.write("College : " + collegeName + "<br>");
        document.write("Student : " + studentName + "<br>");
        document.write("Course : " + course);
    </script>

</body>
</html>
